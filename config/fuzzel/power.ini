# ~/.config/fuzzel/power.ini

[main]
# Typography & Prompts
font=JetBrainsMono Nerd Font:size=12
prompt="Launch: "

# Icons
show-icons=yes
icon-theme=Papirus

# Layout & Dimensions
width=30                 # Scaled down to match your new 20% width preference
lines=8                  # Reduced to match your new 8 lines preference
tabs=4
horizontal-pad=10
vertical-pad=10
inner-pad=4

[colors]
# Format: RRGGBBAA (Alpha required, ff = solid)
background=00141dff
text=ffffffff
match=f27893ff           # Matches your entry text-color
selection=b3e5fcff
selection-text=1a1a1aff
selection-match=f27893ff
border=4fc3f7ff

[border]
width=2
radius=10
