# ~/.config/fuzzel/keybindings.ini

[main]
# Typography & Prompts
font=JetBrainsMono Nerd Font:size=12
prompt="Launch: "

# Icons
show-icons=yes
icon-theme=Papirus

# Layout & Dimensions
width=60                 # Translates roughly to your 45% width preference
lines=24
tabs=4
horizontal-pad=10
vertical-pad=10
inner-pad=4

[colors]
# Format: RRGGBBAA (Alpha required, ff = solid)
background=00141dff
text=ffffffff
match=f27893ff           # Uses your entry color for typed search matches
selection=b3e5fcff
selection-text=1a1a1aff
selection-match=f27893ff
border=4fc3f7ff

[border]
width=2
radius=10
