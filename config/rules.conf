# Borders & gaps
default_border pixel 3
default_floating_border pixel 4

# Float commonly-floating apps
for_window [app_id="mpv"] floating enable, move position center
for_window [app_id="eog"] floating enable, move position center
for_window [app_id="galculator"] floating enable, move position center
for_window [app_id="transmission-gtk"] floating enable, move position center
for_window [app_id="nwg-look"] floating enable, move position center
for_window [app_id="pavucontrol"] floating enable, move position center
for_window [app_id="blueman-manager"] floating enable, move position center

# Nautilus - float dialogs (progress, confirmations, properties, etc.)
for_window [app_id="nautilus" title="File Operation Progress"] floating enable, move position center
for_window [app_id="nautilus" title="Confirm *"] floating enable, move position center
for_window [app_id="nautilus" title="Properties"] floating enable, move position center
for_window [app_id="nautilus" title="Rename *"] floating enable, move position center
for_window [app_id="nautilus" title="Create *"] floating enable, move position center
for_window [app_id="nautilus" title="Error *"] floating enable, move position center
for_window [app_id="nautilus" title="Question *"] floating enable, move position center
for_window [app_id="nautilus" title="Warning *"] floating enable, move position center

# Inhibit idle for fullscreen apps
for_window [app_id=".*"] inhibit_idle fullscreen
